id = "dotfiles.worktree-setup"
name = "Worktree setup"
description = "Run the per-repo setup script and start the agent when a worktree is created"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["macos"]

[[events]]
on = "worktree.created"
command = ["python3", "on_worktree_created.py"]
