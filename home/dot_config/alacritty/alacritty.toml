[font]
normal = {family = 'FiraCode Nerd Font', style = "Regular"}
bold = {family = 'FiraCode Nerd Font', style = "Bold"}
italic = {family = 'FiraCode Nerd Font', style = "Italic"}
size = 20

[keyboard]
bindings = [
  # herdr
  {chars = "\u0013w", key = "G", mods = "Command" },
  {chars = "\u0013K", key = "D", mods = "Command|Shift" },
  {chars = "\u0013c", key = "T", mods = "Command" },
  {chars = "\u0013X", key = "W", mods = "Command" },
  {action = "CreateNewTab", key = "T", mods = "Command|Shift" },
  {chars = "\u00131", key = "1", mods = "Command" },
  {chars = "\u00132", key = "2", mods = "Command" },
  {chars = "\u00133", key = "3", mods = "Command" },
  {chars = "\u00134", key = "4", mods = "Command" },
  {chars = "\u00135", key = "5", mods = "Command" },
  {chars = "\u00136", key = "6", mods = "Command" },
  {chars = "\u00137", key = "7", mods = "Command" },
  {chars = "\u00138", key = "8", mods = "Command" },
  {chars = "\u00139", key = "9", mods = "Command" },
]

[general]
# theme
import = [
    "~/.config/alacritty/themes/themes/one_dark.toml"
]

